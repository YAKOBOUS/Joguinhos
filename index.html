<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ábaco da Tabuada</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f0f4f8;
            color: #333;
            margin: 0;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        h1 {
            font-size: 1.25rem;
            color: #1e3a8a;
            margin: 4px 0;
            text-align: center;
        }
        p.subtitle {
            font-size: 0.8rem;
            color: #64748b;
            margin: 0 0 12px 0;
            text-align: center;
        }
        .dashboard {
            background: white;
            padding: 10px 16px;
            border-radius: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            margin-bottom: 12px;
            text-align: center;
            width: 100%;
            max-width: 400px;
        }
        .result-text {
            font-size: 1.4rem;
            font-weight: bold;
            color: #2563eb;
            margin: 2px 0;
        }
        .hint {
            font-size: 0.75rem;
            color: #475569;
            min-height: 16px;
        }
        .mode-switch {
            display: flex;
            gap: 8px;
            width: 100%;
            max-width: 400px;
            margin-bottom: 10px;
        }
        .mode-btn {
            flex: 1;
            padding: 8px;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            background: white;
            color: #475569;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.15s;
        }
        .mode-btn.active-mult {
            background: #2563eb;
            border-color: #2563eb;
            color: white;
        }
        .mode-btn.active-rem {
            background: #f59e0b;
            border-color: #f59e0b;
            color: white;
        }
        .grid-container {
            display: grid;
            grid-template-columns: 22px repeat(10, minmax(0, 1fr));
            grid-template-rows: 22px repeat(10, minmax(0, 1fr));
            gap: 3px;
            background: #cbd5e1;
            padding: 6px;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 400px;
            aspect-ratio: 1;
        }
        .cell-header {
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.75rem;
            color: #475569;
            user-select: none;
        }
        .cell {
            background: white;
            border-radius: 4px;
            cursor: pointer;
            user-select: none;
            transition: background 0.12s;
            width: 100%;
            height: 100%;
        }
        .cell.highlight {
            background: #93c5fd;
        }
        .cell.selected {
            background: #2563eb;
        }
        .cell.remainder {
            background: #f59e0b !important;
        }
        .actions {
            margin-top: 12px;
            display: flex;
            gap: 8px;
            width: 100%;
            max-width: 400px;
        }
        .action-btn {
            flex: 1;
            background: #ef4444;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
        }
        .action-btn.secondary {
            background: #475569;
        }
    </style>
</head>
<body>

    <h1>Ábaco da Tabuada</h1>
    <p class="subtitle">Toque na grade para multiplicar ou mude o modo para marcar o resto.</p>

    <div class="dashboard">
        <div class="result-text" id="operationText">Toque na grade</div>
        <div class="hint" id="remainderText">Selecione linha e coluna</div>
    </div>

    <div class="mode-switch">
        <button class="mode-btn active-mult" id="btnMult" onclick="setMode('mult')">Multiplicar</button>
        <button class="mode-btn" id="btnRem" onclick="setMode('rem')">Marcar Resto</button>
    </div>

    <div class="grid-container" id="grid"></div>

    <div class="actions">
        <button class="action-btn secondary" onclick="clearRemainders()">Limpar Restos</button>
        <button class="action-btn" onclick="resetAll()">Reiniciar</button>
    </div>

    <script>
        const grid = document.getElementById('grid');
        const operationText = document.getElementById('operationText');
        const remainderText = document.getElementById('remainderText');
        const btnMult = document.getElementById('btnMult');
        const btnRem = document.getElementById('btnRem');
        
        let selectedRow = null;
        let selectedCol = null;
        let mode = 'mult';
        const remainders = {};

        function setMode(newMode) {
            mode = newMode;
            btnMult.classList.toggle('active-mult', mode === 'mult');
            btnRem.classList.toggle('active-rem', mode === 'rem');
        }

        function createGrid() {
            grid.innerHTML = '';
            grid.appendChild(document.createElement('div'));

            for (let c = 1; c <= 10; c++) {
                const colHeader = document.createElement('div');
                colHeader.className = 'cell-header';
                colHeader.innerText = c;
                grid.appendChild(colHeader);
            }

            for (let r = 1; r <= 10; r++) {
                const rowHeader = document.createElement('div');
                rowHeader.className = 'cell-header';
                rowHeader.innerText = r;
                grid.appendChild(rowHeader);

                for (let c = 1; c <= 10; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.row = r;
                    cell.dataset.col = c;

                    let lastTap = 0;

                    cell.addEventListener('pointerup', (e) => {
                        e.preventDefault();
                        const now = Date.now();
                        const isDoubleTap = (now - lastTap) < 320;
                        lastTap = now;

                        if (isDoubleTap) {
                            toggleRemainder(r, c);
                        } else if (mode === 'rem') {
                            toggleRemainder(r, c);
                        } else {
                            selectCell(r, c);
                        }
                    });

                    grid.appendChild(cell);
                }
            }
        }

        function selectCell(r, c) {
            selectedRow = r;
            selectedCol = c;
            updateDisplay();
        }

        function toggleRemainder(r, c) {
            const key = `${r}-${c}`;
            if (remainders[key]) {
                delete remainders[key];
            } else {
                remainders[key] = true;
            }
            updateDisplay();
        }

        function updateDisplay() {
            const cells = document.querySelectorAll('.cell');
            let remainderCount = 0;

            cells.forEach(cell => {
                const r = parseInt(cell.dataset.row);
                const c = parseInt(cell.dataset.col);
                const key = `${r}-${c}`;

                cell.classList.remove('highlight', 'selected', 'remainder');

                if (selectedRow && selectedCol) {
                    if (r <= selectedRow && c <= selectedCol) {
                        cell.classList.add('highlight');
                    }
                    if (r === selectedRow && c === selectedCol) {
                        cell.classList.add('selected');
                    }
                }

                if (remainders[key]) {
                    cell.classList.add('remainder');
                    remainderCount++;
                }
            });

            if (selectedRow && selectedCol) {
                const product = selectedRow * selectedCol;
                operationText.innerText = `${selectedRow} × ${selectedCol} = ${product}`;
                
                if (remainderCount > 0) {
                    remainderText.innerText = `Resto: ${remainderCount} | Total: ${product + remainderCount}`;
                } else {
                    remainderText.innerText = `Toque duplo ou use "Marcar Resto" para somar sobras`;
                }
            } else {
                operationText.innerText = remainderCount > 0 ? `Resto: ${remainderCount}` : "Toque na grade";
                remainderText.innerText = "Selecione linha e coluna";
            }
        }

        function clearRemainders() {
            for (const key in remainders) {
                delete remainders[key];
            }
            updateDisplay();
        }

        function resetAll() {
            selectedRow = null;
            selectedCol = null;
            setMode('mult');
            clearRemainders();
        }

        createGrid();
    </script>
</body>
</html>
