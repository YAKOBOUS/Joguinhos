<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ábaco da Tabuada</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f0f4f8;
            color: #1e293b;
            margin: 0;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        h1 {
            font-size: 1.2rem;
            color: #1e3a8a;
            margin: 4px 0 10px 0;
            text-align: center;
        }
        .dashboard {
            background: white;
            padding: 12px 16px;
            border-radius: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            margin-bottom: 12px;
            text-align: center;
            width: 100%;
            max-width: 400px;
        }
        .total-badge {
            display: inline-block;
            background: #fef3c7;
            border: 2px solid #f59e0b;
            color: #92400e;
            font-size: 1.75rem;
            font-weight: 800;
            padding: 6px 22px;
            border-radius: 10px;
            margin-bottom: 6px;
        }
        .formula-text {
            font-size: 1.05rem;
            font-weight: 700;
            color: #1e3a8a;
            min-height: 22px;
        }
        .division-text {
            font-size: 0.85rem;
            font-weight: 600;
            color: #64748b;
            margin-top: 2px;
            min-height: 18px;
        }
        .grid-container {
            display: grid;
            grid-template-columns: 22px repeat(10, minmax(0, 1fr));
            grid-template-rows: 22px repeat(10, minmax(0, 1fr));
            gap: 3px;
            background: #cbd5e1;
            padding: 6px;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 400px;
            aspect-ratio: 1;
        }
        .cell-header {
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.75rem;
            color: #475569;
        }
        .cell {
            background: white;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.1s;
            width: 100%;
            height: 100%;
        }
        .cell.active {
            background: #f59e0b;
        }
        .actions {
            margin-top: 12px;
            width: 100%;
            max-width: 400px;
        }
        .reset-btn {
            width: 100%;
            background: #ef4444;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>Ábaco da Tabuada</h1>

    <div class="dashboard">
        <div class="total-badge" id="totalText">Total: 0</div>
        <div class="formula-text" id="formulaText">Toque na grade para começar</div>
        <div class="division-text" id="divisionText"></div>
    </div>

    <div class="grid-container" id="grid"></div>

    <div class="actions">
        <button class="reset-btn" onclick="resetAll()">Reiniciar</button>
    </div>

    <script>
        const grid = document.getElementById('grid');
        const totalText = document.getElementById('totalText');
        const formulaText = document.getElementById('formulaText');
        const divisionText = document.getElementById('divisionText');

        let baseCols = 0;
        const activeCells = new Set();

        function createGrid() {
            grid.innerHTML = '';
            grid.appendChild(document.createElement('div'));

            for (let c = 1; c <= 10; c++) {
                const colHeader = document.createElement('div');
                colHeader.className = 'cell-header';
                colHeader.innerText = c;
                grid.appendChild(colHeader);
            }

            for (let r = 1; r <= 10; r++) {
                const rowHeader = document.createElement('div');
                rowHeader.className = 'cell-header';
                rowHeader.innerText = r;
                grid.appendChild(rowHeader);

                for (let c = 1; c <= 10; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.row = r;
                    cell.dataset.col = c;

                    cell.addEventListener('pointerup', (e) => {
                        e.preventDefault();
                        handleTap(r, c);
                    });

                    grid.appendChild(cell);
                }
            }
        }

        function handleTap(r, c) {
            const key = `${r}-${c}`;

            if (activeCells.size === 0) {
                baseCols = c;
                for (let row = 1; row <= r; row++) {
                    for (let col = 1; col <= c; col++) {
                        activeCells.add(`${row}-${col}`);
                    }
                }
            } else {
                if (activeCells.has(key)) {
                    activeCells.delete(key);
                } else {
                    activeCells.add(key);
                }
                if (activeCells.size === 0) {
                    baseCols = 0;
                }
            }

            updateDisplay();
        }

        function updateDisplay() {
            const cells = document.querySelectorAll('.cell');
            cells.forEach(cell => {
                const key = `${cell.dataset.row}-${cell.dataset.col}`;
                cell.classList.toggle('active', activeCells.has(key));
            });

            const total = activeCells.size;
            totalText.innerText = `Total: ${total}`;

            if (total === 0) {
                formulaText.innerText = "Toque na grade para começar";
                divisionText.innerText = "";
                return;
            }

            let completeRows = 0;
            let remainder = 0;

            for (let r = 1; r <= 10; r++) {
                let inBase = 0;
                let extra = 0;
                for (let c = 1; c <= 10; c++) {
                    if (activeCells.has(`${r}-${c}`)) {
                        if (baseCols > 0 && c <= baseCols) inBase++;
                        else extra++;
                    }
                }
                if (baseCols > 0 && inBase === baseCols && extra === 0) {
                    completeRows++;
                } else {
                    remainder += inBase + extra;
                }
            }

            if (completeRows > 0 && remainder > 0) {
                formulaText.innerText = `${completeRows} × ${baseCols} + ${remainder} = ${total}`;
                divisionText.innerText = `${total} ÷ ${baseCols} = ${completeRows} (Resto ${remainder})`;
            } else if (completeRows > 0) {
                formulaText.innerText = `${completeRows} × ${baseCols} = ${total}`;
                divisionText.innerText = `${total} ÷ ${baseCols} = ${completeRows}`;
            } else {
                formulaText.innerText = `${total} selecionado(s)`;
                divisionText.innerText = "";
            }
        }

        function resetAll() {
            activeCells.clear();
            baseCols = 0;
            updateDisplay();
        }

        createGrid();
    </script>
</body>
</html>
